name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile iOS + watchOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "iphoneos|watchos"
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, generic iOS device, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project WatchMemo.xcodeproj \
            -scheme WatchMemo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          # 构建日志在部分环境下不方便下载，把编译错误汇总成一条注解，便于在 Checks 页面或 API 中直接查看
          if [ -f build.log ]; then
            ERRS=$(grep -E ": error: |error: " build.log | sed -E 's#^.*/(WatchMemo|WatchMemoWatch|Shared)/#\1/#' | sort -u | head -60)
            if [ -n "$ERRS" ]; then
              BODY=$(printf '%s' "$ERRS" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=Compile errors::${BODY}"
            else
              TAIL=$(tail -40 build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=Build failed (log tail)::${TAIL}"
            fi
          fi

      - name: Report source warnings
        if: success()
        run: |
          W=$(grep -E "(WatchMemo|WatchMemoWatch|Shared)/[^ ]+\.swift:[0-9]+:[0-9]+: warning: " build.log | sed -E 's#^.*/(WatchMemo|WatchMemoWatch|Shared)/#\1/#' | sort -u | head -60)
          if [ -n "$W" ]; then
            BODY=$(printf '%s' "$W" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::warning title=Swift warnings::${BODY}"
          fi

      - name: Verify watch app is embedded
        run: |
          APP=build/Build/Products/Release-iphoneos/WatchMemo.app
          echo "== iOS app contents =="; ls "$APP"
          if [ ! -d "$APP/Watch" ]; then
            echo "::error::Watch app is NOT embedded in WatchMemo.app/Watch — check project.yml dependency/embed settings"
            exit 1
          fi
          echo "== Embedded watch app =="; ls "$APP/Watch"
          /usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$APP"/Watch/*.app/Info.plist

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WatchMemo.app Payload/
          zip -qry WatchMemo-unsigned.ipa Payload
          ls -lh WatchMemo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WatchMemo-unsigned-ipa
          path: WatchMemo-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
